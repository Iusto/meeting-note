name: ai-meeting
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ai_meeting
      POSTGRES_USER: ai_meeting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ai_meeting -d ai_meeting']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ai_meeting
      SPRING_DATASOURCE_USERNAME: ai_meeting
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_OWNER_TOKEN: ${APP_OWNER_TOKEN:?Set APP_OWNER_TOKEN in .env}
      APP_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8088},http://127.0.0.1:${WEB_PORT:-8088}
      APP_RECORDING_ROOT: /data/recordings
      PAID_API_TESTS_ENABLED: ${PAID_API_TESTS_ENABLED:-false}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MAXIMUM_AUDIO_SECONDS: ${AI_MAXIMUM_AUDIO_SECONDS:-14400}
      AI_MAXIMUM_MEETING_USD: ${AI_MAXIMUM_MEETING_USD:-3.00}
      AI_DEEPGRAM_RATE_PER_MINUTE: ${AI_DEEPGRAM_RATE_PER_MINUTE:-0.011}
      AI_PRICE_VERSION: ${AI_PRICE_VERSION:-config-record}
      AI_OPENAI_INPUT_RATE_PER_MILLION: ${AI_OPENAI_INPUT_RATE_PER_MILLION:-2.00}
      AI_OPENAI_OUTPUT_RATE_PER_MILLION: ${AI_OPENAI_OUTPUT_RATE_PER_MILLION:-10.00}
      AI_OUTPUT_TOKEN_CAP: ${AI_OUTPUT_TOKEN_CAP:-2000}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      SERVER_FORWARD_HEADERS_STRATEGY: none
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - recordings:/data/recordings
    restart: unless-stopped
  web:
    build: ./apps/web
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  recordings:
